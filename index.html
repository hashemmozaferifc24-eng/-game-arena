<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAME ARENA | حکم</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:tahoma;text-align:center}
header{background:#17264a;padding:18px;font-size:22px;font-weight:bold}
.info{padding:12px;background:#1c2c43}
button{font-family:tahoma;cursor:pointer}
#start{background:#e8b43c;color:#111;border:0;border-radius:10px;padding:13px 25px;font-size:17px;margin:12px}
#table{max-width:600px;margin:15px auto;background:#126344;border:7px solid #754a2a;border-radius:25px;padding:12px;min-height:350px}
.player{font-size:14px;margin:8px;color:#fff}
#middle{height:170px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;align-items:center;gap:5px}
.played{background:#fff;color:#111;border-radius:9px;padding:12px 3px;min-height:60px;font-size:23px;font-weight:bold}
#leftCard{grid-column:1;grid-row:1/3}
#topCard{grid-column:2;grid-row:1}
#rightCard{grid-column:3;grid-row:1/3}
#bottomCard{grid-column:2;grid-row:2}
#hand{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:10px;max-width:600px;margin:auto}
.card{background:#fff;color:#111;border:2px solid #ddd;border-radius:8px;width:45px;height:65px;font-size:17px;font-weight:bold}
.red{color:#d21e35}
.card:disabled{opacity:.45}
#message{padding:12px;min-height:48px;color:#ffdf70;line-height:1.8}
#choose{padding:10px}
.suit{background:#fff;border:0;border-radius:10px;font-size:28px;width:58px;height:55px;margin:5px}
#score{padding:10px;background:#17264a;margin-top:10px}
.small{font-size:12px;color:#ddd;padding:8px}
</style>
</head>
<body>

<header>🎮 GAME ARENA | حکم</header>

<div class="info">
<div>👤 تو + 🤖 یار تو</div>
<div>🆚</div>
<div>🤖 حریف اول + 🤖 حریف دوم</div>
<div id="score">امتیاز تیم تو: ۰ | امتیاز حریف: ۰</div>
<button id="start" onclick="newGame()">شروع بازی جدید</button>
</div>

<div id="table">
<div class="player">🤖 یار تو</div>
<div id="middle">
<div class="played" id="leftCard">🃏</div>
<div class="played" id="topCard">🃏</div>
<div class="played" id="rightCard">🃏</div>
<div class="played" id="bottomCard">🃏</div>
</div>
<div class="player">👤 تو</div>
</div>

<div id="message">برای شروع بازی دکمه را بزن.</div>
<div id="choose"></div>
<div class="small" id="turnInfo"></div>
<div id="hand"></div>

<script>
const suits=[
{id:"S",symbol:"♠",name:"پیک"},
{id:"H",symbol:"♥",name:"دل"},
{id:"D",symbol:"♦",name:"خشت"},
{id:"C",symbol:"♣",name:"گشنیز"}
];

let hands=[[],[],[],[]];
let trick=[];
let trump=null;
let leadSuit=null;
let turn=0;
let tricks=[0,0];
let match=[0,0];
let phase="waiting";
let trickNo=0;
let busy=false;
let roundLeader=0;

function makeDeck(){
let d=[];
for(let s of suits){
for(let r=2;r<=14;r++){
d.push({s:s.id,r:r});
}}
return d;
}

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function cardName(c){
let s=suits.find(x=>x.id===c.s);
let r=c.r<=10?String(c.r):({11:"J",12:"Q",13:"K",14:"A"}[c.r]);
return r+s.symbol;
}

function isRed(c){
return c.s==="H"||c.s==="D";
}

function sortHand(){
hands.forEach(h=>{
h.sort((a,b)=>suits.findIndex(x=>x.id===a.s)-suits.findIndex(x=>x.id===b.s)||a.r-b.r);
});
}

function newGame(){
hands=[[],[],[],[]];
trick=[];
trump=null;
leadSuit=null;
turn=0;
tricks=[0,0];
match=[0,0];
trickNo=0;
busy=false;
roundLeader=0;
phase="choosing";

let deck=shuffle(makeDeck());

for(let i=0;i<5;i++){
for(let p=0;p<4;p++){
hands[p].push(deck.pop());
}
}

sortHand();
clearCards();
render();

document.getElementById("message").innerText="۵ کارت اول پخش شد. خال حکم را انتخاب کن.";
document.getElementById("choose").innerHTML=
"<div>خال حکم را انتخاب کن:</div>"+
suits.map(s=>'<button class="suit" onclick="chooseTrump(\''+s.id+'\')">'+s.symbol+'</button>').join("");

document.getElementById("turnInfo").innerText="تو حاکمی؛ حکم را انتخاب کن.";
}

function chooseTrump(s){
if(phase!=="choosing")return;

trump=s;
phase="playing";

let deck=makeDeck();
let used=[];

hands.forEach(h=>{
h.forEach(c=>used.push(c.s+"-"+c.r));
});

deck=deck.filter(c=>!used.includes(c.s+"-"+c.r));
shuffle(deck);

for(let p=0;p<4;p++){
while(hands[p].length<13){
hands[p].push(deck.pop());
}
}

sortHand();

document.getElementById("choose").innerHTML="";
document.getElementById("message").innerText=
"حکم "+suits.find(x=>x.id===trump).name+" است. تو شروع کن!";

turn=0;
roundLeader=0;
render();
}

function clearCards(){
["leftCard","topCard","rightCard","bottomCard"].forEach(id=>{
let el=document.getElementById(id);
el.innerText="🃏";
el.style.color="#111";
});
}

function render(){
document.getElementById("score").innerText=
"امتیاز تیم تو: "+match[0]+" | امتیاز حریف: "+match[1];

document.getElementById("hand").innerHTML="";

hands[0].forEach((c,i)=>{
let b=document.createElement("button");
b.className="card "+(isRed(c)?"red":"");
b.innerText=cardName(c);
b.disabled=phase!=="playing"||turn!==0||busy||!validCard(c);
b.onclick=()=>playCard(0,i);
document.getElementById("hand").appendChild(b);
});

document.getElementById("turnInfo").innerText=
"دست‌های این دور: تیم تو "+tricks[0]+" | حریف "+tricks[1]+
(trump?" | حکم: "+suits.find(s=>s.id===trump).symbol:"");
}

function validCard(c){
if(trick.length===0)return true;
return hands[0].some(x=>x.s===leadSuit)?c.s===leadSuit:true;
}

function playCard(p,index){
if(phase!=="playing"||busy||turn!==p)return;

let c=hands[p][index];

if(p===0&&!validCard(c)){
document.getElementById("message").innerText="باید از خال شروع‌شده بازی کنی!";
return;
}

hands[p].splice(index,1);

if(trick.length===0)leadSuit=c.s;

trick.push({p,c});
showTrickCard(p,c);

turn=(p+1)%4;
render();

if(trick.length===4){
busy=true;
setTimeout(resolveTrick,1100);
}else{
if(turn!==0){
setTimeout(botTurn,650);
}else{
document.getElementById("message").innerText="نوبت توست؛ کارتت را انتخاب کن.";
}
}
}

function showTrickCard(p,c){
let ids=["bottomCard","leftCard","topCard","rightCard"];
let el=document.getElementById(ids[p]);
el.innerText=cardName(c);
el.style.color=isRed(c)?"#d21e35":"#111";
}

function botTurn(){
if(phase!=="playing"||busy||turn===0)return;

let p=turn;

let possible=hands[p].map((c,i)=>({c,i})).filter(x=>{
if(trick.length===0)return true;
return hands[p].some(y=>y.s===leadSuit)?x.c.s===leadSuit:true;
});

let choice;

if(trick.length===0){
choice=possible[Math.floor(Math.random()*possible.length)];
}else{
choice=possible[Math.floor(Math.random()*possible.length)];
}

playCard(p,choice.i);
}

function strength(c){
if(c.s===trump)return 100+c.r;
if(c.s===leadSuit)return c.r;
return 0;
}

function resolveTrick(){
let winner=trick[0];

for(let x of trick){
if(strength(x.c)>strength(winner.c)){
winner=x;
}
}

let team=winner.p%2===0?0:1;
tricks[team]++;
trickNo++;
roundLeader=winner.p;

document.getElementById("message").innerText=
(team===0?"تیم تو":"تیم حریف")+" این دست را برد!";

trick=[];
clearCards();

if(trickNo===13){
setTimeout(endRound,900);
return;
}

turn=roundLeader;
busy=false;
render();

if(turn!==0){
setTimeout(botTurn,700);
}else{
document.getElementById("message").innerText+=" نوبت توست.";
}
}

function endRound(){
let winner=tricks[0]>tricks[1]?0:1;
match[winner]++;

document.getElementById("score").innerText=
"امتیاز تیم تو: "+match[0]+" | امتیاز حریف: "+match[1];

if(match[winner]>=7){
phase="finished";
document.getElementById("message").innerText=
(winner===0?"🎉 تبریک! تو و یارت":"🤖 تیم حریف")+
" برنده مسابقه شدید!";
document.getElementById("choose").innerHTML=
'<button id="start" onclick="newGame()">شروع مسابقه جدید</button>';
document.getElementById("hand").innerHTML="";
return;
}

document.getElementById("message").innerText=
(winner===0?"تیم تو":"تیم حریف")+
" این دور را برد. نتیجه دست‌ها: "+tricks[0]+" به "+tricks[1]+
". دور بعدی آماده است.";

document.getElementById("choose").innerHTML=
'<button id="start" onclick="nextRound()">پخش دور بعدی</button>';

phase="roundend";
document.getElementById("hand").innerHTML="";
}

function nextRound(){
hands=[[],[],[],[]];
trick=[];
trump=null;
leadSuit=null;
turn=0;
tricks=[0,0];
trickNo=0;
busy=false;
roundLeader=0;
phase="choosing";

let deck=shuffle(makeDeck());

for(let i=0;i<5;i++){
for(let p=0;p<4;p++){
hands[p].push(deck.pop());
}
}

sortHand();
clearCards();
render();

document.getElementById("message").innerText=
"۵ کارت اول پخش شد. خال حکم را انتخاب کن.";

document.getElementById("choose").innerHTML=
"<div>خال حکم را انتخاب کن:</div>"+
suits.map(s=>'<button class="suit" onclick="chooseTrump(\''+s.id+'\')">'+s.symbol+'</button>').join("");
}

</script>
</body>
</html>
