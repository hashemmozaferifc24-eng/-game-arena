      <body>
<header>
<div class="logo">GAME <span>ARENA</span> 🎮</div>
<div class="subtitle">دنیای رقابت، رفاقت و بازی آنلاین</div>
</header>

<main class="container">

<section class="welcome">
<h2>به میدان بازی خوش آمدی!</h2>
<p>دوستانت را دعوت کن، تیم بساز و در رقابت‌های آنلاین شرکت کن. اینجا جای بازیکنان حرفه‌ای است!</
      <section class="room">
<h3>🏠 ساخت اتاق بازی</h3>
<p>ساخت اتاق عمومی برای رقابت با بازیکنان دیگر، یا اتاق خصوصی برای بازی با دوستان. ساخت اتاق مخصوص اعضای پرمیوم است.</p>

<button class="public" onclick="showModal('اتاق عمومی','برای ساخت اتاق عمومی به عضویت پرمیوم نیاز داری.')">
ساخت اتاق عمومی
</button>

<button class="private" onclick="showModal('اتاق خصوصی','برای ساخت اتاق خصوصی به عضویت پرمیوم نیاز داری.')">
ساخت اتاق خصوصی
</button>
</section>

</main>

<footer>
GAME ARENA © 2026<br>
بازی کن، رقابت کن، قهرمان شو!
</footer>

<div class="modal" id="modal">
<div class="modal-box">
<h3 id="modalTitle"></h3>
<p id="modalText"></p>
<button class="close" onclick="closeModal()">متوجه شدم</button>
</div>
</div>

<script>
function showModal(title,message){
document.getElementById('modalTitle').textContent=title;
document.getElementById('modalText').textContent=message;
document.getElementById('modal').style.display='flex';
}
function closeModal(){
document.getElementById('modal').style.display='none';
}
</script>
